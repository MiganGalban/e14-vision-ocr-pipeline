[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e14-vision-ocr-pipeline"
version = "0.1.0"
description = "Pipeline de ingeniería de datos, muestreo estadístico y visión artificial para procesamiento de actas electorales E-14."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Migan Giuseppe Galban Pineda" }
]
dependencies = [
    "curl_cffi>=0.7.0",
    "easyocr>=1.7.1",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0,<2.1.0",
    "opencv-python-headless>=4.9.0",
    "pandas>=2.2.0",
    "pdf2image>=1.17.0",
    "Pillow>=10.2.0",
    "python-dotenv>=1.0.1",
    "sentencepiece>=0.2.0",
    "supabase>=2.4.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers==4.46.3",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]