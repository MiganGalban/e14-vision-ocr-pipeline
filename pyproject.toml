[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e14-vision-ocr-pipeline"
version = "0.1.0"
description = "Pipeline de ingeniería de datos, muestreo estadístico y visión artificial para procesamiento de actas electorales E-14."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Migan Giuseppe Galban Pineda" }
]
dependencies = [
    curl_cffi==0.16.0,
    easyocr==1.7.2,
    matplotlib==3.11.1,
    numpy==2.5.2,
    opencv_python==5.0.0.93,
    opencv_python_headless==5.0.0.93,
    pandas==3.0.5,
    pdf2image==1.17.0,
    Pillow==12.3.0,
    python-dotenv==1.2.3,
    supabase==2.31.0,
    torch==2.5.1+cu121,
    transformers==5.13.1,
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]